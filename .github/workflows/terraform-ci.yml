name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
      - run: tflint --recursive --format compact

  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  user-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Tooling app
        run: php -l app/tooling/index.php
      - name: Shellcheck boot scripts
        run: |
          # Templates use Terraform ${...} placeholders; shellcheck still catches bash mistakes.
          for f in templates/*.tftpl; do
            sed 's/%%{/%{/g' "$f" > "/tmp/$(basename "$f" .tftpl)"
          done
          shellcheck -S warning -e SC2154,SC2016 /tmp/*.sh
